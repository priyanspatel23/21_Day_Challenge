<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>Unique Modal</title>
  <link rel="stylesheet" href="styles.css" />
</head>

<body>
  <button class="open-btn" id="openBtn">🚀 Launch Modal</button>

  <div class="overlay" id="overlay">

      <span class="close" id="closeBtn">&times;</span>

      <h2>💻 Welcome Developer</h2>
      <p>Crafted for developers — clean, smooth, and production-ready UI.</p>
      <button class="action">Continue</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>

</html>
